[workspace]
resolver = "3"
members = [
  "crates/sentinel0-proto",
  "crates/sentinel0-agent",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.86"

[workspace.dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
glob = "0.3.4"
http = "1.5.0"
nix = { version = "0.31.3", features = ["signal", "process", "user", "fs"] }
proptest = "1.11.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
shlex = "2.0.1"
similar = "3.2.0"
soft-canonicalize = "0.5.6"
thiserror = "2.0.20"
tar = "0.4.46"
tempfile = "3.27.0"
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "process", "signal", "io-util", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
url = "2.5.8"
walkdir = "2.5.0"
yaml_serde = "0.10.7"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
complexity = "warn"
perf = "warn"
style = "warn"
