name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust-shared-cache:
    name: Rust 1.99.1 Linux, tests
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@2376b14a6bc8263ab77013bd744248f49384b2fa # main
    with:
      runner: ubuntu-26.04
      command: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ripgrep
        cargo +1.99.1 metadata --locked --format-version 1 >/dev/null
        python3 -m unittest discover -s .github/scripts -p 'test_*.py'
        cargo +1.99.1 fmt --all -- --check
        cargo +1.99.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
        cargo +1.99.1 test --locked --workspace --all-targets
      rust-toolchain: "1.99.1"
      rust-components: "rustfmt clippy"
      rustflags: "-C target-cpu=x86-64-v2"

  fuzz-smoke:
    name: Fuzz smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@2376b14a6bc8263ab77013bd744248f49384b2fa # main
        with:
          rust-toolchain: nightly
      - name: Protocol JSON
        run: cargo fuzz run protocol_json --target x86_64-unknown-linux-gnu -- -runs=10000
      - name: Binary transfer frame
        run: cargo fuzz run binary_frame --target x86_64-unknown-linux-gnu -- -runs=10000
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@2376b14a6bc8263ab77013bd744248f49384b2fa # main

  release:
    name: Release binary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-shared-cache]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install current stable Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@2376b14a6bc8263ab77013bd744248f49384b2fa # main
        with:
          rust-toolchain: "1.99.1"
      - name: Build
        run: cargo +1.99.1 build --locked --release --bin sentinelx-core
      - name: Smoke
        run: ./target/release/sentinelx-core --help >/dev/null
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@2376b14a6bc8263ab77013bd744248f49384b2fa # main
      - name: Checksum
        run: (cd target/release && sha256sum sentinelx-core > sentinelx-core.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinelx-core-linux-x86_64
          path: |
            target/release/sentinelx-core
            target/release/sentinelx-core.sha256
          if-no-files-found: error
          retention-days: 7
