name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust stable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: stable
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets

  msrv:
    name: Rust 1.85 MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.85
      - name: Check all targets
        run: cargo check --workspace --all-targets
      - name: Tests
        run: cargo test --workspace

  fuzz-smoke:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-nightly
      - name: Protocol JSON
        run: cargo fuzz run protocol_json -- -runs=10000
      - name: Binary transfer frame
        run: cargo fuzz run binary_frame -- -runs=10000

  release:
    name: Release binary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust, msrv, fuzz-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - name: Build
        run: cargo build --release --bin sentinelx-core
      - name: Smoke
        run: ./target/release/sentinelx-core --help >/dev/null
      - name: Checksum
        run: sha256sum target/release/sentinelx-core > target/release/sentinelx-core.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sentinelx-core-linux-x86_64
          path: |
            target/release/sentinelx-core
            target/release/sentinelx-core.sha256
          if-no-files-found: error
          retention-days: 7
