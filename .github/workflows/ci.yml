name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust-shared-cache:
    name: Rust 1.99.1 Linux, maintenance and tests
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@23b86d2eeed31f7893c34e942c32cf6555299dbb # main
    with:
      runner: ubuntu-26.04
      command: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ripgrep
        cargo +1.99.1 metadata --locked --format-version 1 >/dev/null
        python3 -m unittest discover -s .github/scripts -p 'test_*.py'
        # The synthetic wrapper regression must control its scratch target and
        # mock native compiler launcher and toolchain detection. Keep RUSTC_WRAPPER and the real job's
        # mandatory sccache intact for the subsequent Rust builds.
        maint_log="$RUNNER_TEMP/sentinelx-build-cache-regression.log"
        if ! env -u CARGO_TARGET_DIR -u CMAKE_C_COMPILER_LAUNCHER -u CMAKE_CXX_COMPILER_LAUNCHER -u RUSTUP_TOOLCHAIN bash -x ops/build-cache/test.sh >"$maint_log" 2>&1; then
          echo "Synthetic Cargo wrapper regression failed; last commands:" >&2
          tail -120 "$maint_log" >&2
          exit 1
        fi
        tail -1 "$maint_log"
        rm -f "$maint_log"
        cargo +1.99.1 fmt --all -- --check
        cargo +1.99.1 clippy --locked --workspace --all-targets --all-features -- -D warnings
        cargo +1.99.1 test --locked --workspace --all-targets
      rust-toolchain: "1.99.1"
      rust-components: "rustfmt clippy"
      rustflags: "-C target-cpu=x86-64-v2"

  fuzz-smoke:
    name: Fuzz smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-fuzz
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@23b86d2eeed31f7893c34e942c32cf6555299dbb # main
        with:
          rust-toolchain: nightly
      - name: Protocol JSON
        run: cargo fuzz run protocol_json --target x86_64-unknown-linux-gnu -- -runs=10000
      - name: Binary transfer frame
        run: cargo fuzz run binary_frame --target x86_64-unknown-linux-gnu -- -runs=10000
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@23b86d2eeed31f7893c34e942c32cf6555299dbb # main

  release:
    name: Release binary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-shared-cache]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install current stable Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@23b86d2eeed31f7893c34e942c32cf6555299dbb # main
        with:
          rust-toolchain: "1.99.1"
      - name: Build
        run: cargo +1.99.1 build --locked --release --bin sentinelx-core
      - name: Smoke
        run: ./target/release/sentinelx-core --help >/dev/null
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@23b86d2eeed31f7893c34e942c32cf6555299dbb # main
      - name: Checksum
        run: (cd target/release && sha256sum sentinelx-core > sentinelx-core.sha256)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.2
        with:
          name: sentinelx-core-linux-x86_64
          path: |
            target/release/sentinelx-core
            target/release/sentinelx-core.sha256
          if-no-files-found: error
          retention-days: 7
