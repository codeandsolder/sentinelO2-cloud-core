name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  rust-shared-cache:
    name: Rust Linux tests
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@7b23cbecfad3c032467c8e31bae2837cff7d18db # main
    with:
      runner: ubuntu-26.04
      command: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends ripgrep
        cargo metadata --locked --format-version 1 >/dev/null
        python3 -m unittest discover -s .github/scripts -p 'test_*.py'
        cargo fmt --all -- --check
        cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
        cargo test --locked --workspace --all-targets
      rustflags: "-C target-cpu=x86-64-v2"

  rust-windows:
    name: Rust Windows native check and smoke
    permissions:
      contents: read
    uses: codeandsolder/ci-workflows/.github/workflows/rust-sccache.yml@7b23cbecfad3c032467c8e31bae2837cff7d18db # main
    with:
      runner: windows-2025
      command: |
        cargo check --locked -p sentinel0-agent -p sentinel0-proto --all-targets
        cargo test --locked -p sentinel0-proto
        cargo test --locked -p sentinel0-agent --lib -- --test-threads=4
        cargo run --locked -p sentinel0-agent --bin sentinelx-core -- --help >/dev/null

  fuzz-smoke:
    name: Fuzz smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the native quarantined compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@7b23cbecfad3c032467c8e31bae2837cff7d18db # main
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-fuzz
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@7b23cbecfad3c032467c8e31bae2837cff7d18db # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Protocol JSON
        run: cargo fuzz run protocol_json --target x86_64-unknown-linux-gnu -- -runs=10000
      - name: Binary transfer frame
        run: cargo fuzz run binary_frame --target x86_64-unknown-linux-gnu -- -runs=10000
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@7b23cbecfad3c032467c8e31bae2837cff7d18db # main

  release:
    name: Release binary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-shared-cache]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the native quarantined compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@7b23cbecfad3c032467c8e31bae2837cff7d18db # main
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@7b23cbecfad3c032467c8e31bae2837cff7d18db # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Build
        run: cargo build --locked --release --bin sentinelx-core
      - name: Smoke
        run: ./target/release/sentinelx-core --help >/dev/null
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@7b23cbecfad3c032467c8e31bae2837cff7d18db # main
      - name: Checksum
        run: (cd target/release && sha256sum sentinelx-core > sentinelx-core.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinelx-core-linux-x86_64
          path: |
            target/release/sentinelx-core
            target/release/sentinelx-core.sha256
          if-no-files-found: error
          retention-days: 7

  release-windows:
    name: Release Windows x86_64 binary
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [rust-windows]
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the native quarantined compiler
        id: compiler
        uses: codeandsolder/ci-workflows/.github/actions/resolve-rust-toolchain@7b23cbecfad3c032467c8e31bae2837cff7d18db # main
      - name: Install pinned Rust
        run: rustup show active-toolchain
      - name: Setup mandatory sccache
        uses: codeandsolder/ci-workflows/.github/actions/setup-sccache@7b23cbecfad3c032467c8e31bae2837cff7d18db # main
        with:
          rust-toolchain: ${{ steps.compiler.outputs.channel }}
      - name: Build native executable
        run: cargo build --locked --release --bin sentinelx-core
      - name: Executable startup smoke
        run: ./target/release/sentinelx-core.exe --help >/dev/null
      - name: Finalize mandatory sccache
        if: always()
        uses: codeandsolder/ci-workflows/.github/actions/finalize-sccache@7b23cbecfad3c032467c8e31bae2837cff7d18db # main
      - name: Checksum
        run: (cd target/release && sha256sum sentinelx-core.exe > sentinelx-core.exe.sha256)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sentinelx-core-windows-x86_64
          path: |
            target/release/sentinelx-core.exe
            target/release/sentinelx-core.exe.sha256
          if-no-files-found: error
          retention-days: 7
