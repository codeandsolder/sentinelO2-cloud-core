name: Maintenance issue queue

on:
  schedule:
    # 01:17 UTC is before the 04:00 Europe/Warsaw maintenance sweep in both CET and CEST.
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  rust-release-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Detect current stable Rust and queue a full review
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://static.rust-lang.org/dist/channel-rust-stable.toml -o /tmp/rust-stable.toml
          read -r VERSION RELEASE_DATE ELIGIBLE < <(python3 - <<'PY'
          import datetime as dt
          import tomllib
          with open("/tmp/rust-stable.toml", "rb") as f:
              data = tomllib.load(f)
          version = data["pkg"]["rust"]["version"].split()[0]
          release_date = dt.date.fromisoformat(data["date"])
          # The manifest has date precision only. Waiting until UTC midnight
          # four dates later guarantees at least 72 hours even if publication
          # happened at the very end of the release date.
          eligible_at = dt.datetime.combine(
              release_date + dt.timedelta(days=4),
              dt.time.min,
              tzinfo=dt.timezone.utc,
          )
          eligible = dt.datetime.now(dt.timezone.utc) >= eligible_at
          print(version, release_date.isoformat(), "yes" if eligible else "no")
          PY
          )

          test -n "$VERSION"
          echo "Current stable Rust: $VERSION (release date $RELEASE_DATE)"
          if [[ "$ELIGIBLE" != "yes" ]]; then
            echo "Rust $VERSION is still inside the 72-hour release quarantine"
            exit 0
          fi

          gh label create "automation:rust-release" --repo "$REPO" --color "8250df" --description "Queued automatically when stable Rust changes" --force

          marker="rust-stable-${VERSION}"
          existing="$(gh issue list --repo "$REPO" --state all --limit 200 --search "${marker} in:body" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "Rust $VERSION review already exists as issue #$existing"
            exit 0
          fi

          export marker dep details log stat update_log VERSION

          body="$(python3 .github/scripts/render-maintenance-template.py <<'EOF'
          <!-- ${marker} -->
          <!-- automation-queue:rust-release -->

          Rust **${VERSION}** is now the stable toolchain.

          Do a complete repository refresh against this release rather than only replacing the toolchain version:

          - Read the official Rust ${VERSION} announcement and detailed release notes/changelog.
          - Review relevant language, standard-library, rustc, Cargo, Clippy, rustfmt, target/platform, and tooling changes.
          - Review all Rust code, `Cargo.toml`/`Cargo.lock`, CI, Docker/build tooling, `SKILL.md`, README/docs, examples, lints, and project conventions for newly preferable patterns or obsolete workarounds.
          - Adopt useful newly-stable features and current best practices where they improve the project; remove workarounds that the new stable release makes unnecessary.
          - Update the current-stable CI/toolchain references. Keep the MSRV reasonably current and raise it when maintained dependencies require a newer compiler; do not pin dependencies solely to preserve an old MSRV.
          - Run the full CI-equivalent test matrix and fix fallout.
          - If the release genuinely requires no changes beyond what is already present, document what was reviewed and close this issue as a no-op.

          This issue is generated automatically. A ChatGPT maintenance automation is expected to implement it.
          EOF
          )"

          gh issue create --repo "$REPO" --title "Rust ${VERSION}: full best-practices refresh" --label "automation:rust-release" --body "$body"


  upstream-parity-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Prepare upstream parity label
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh label create "automation:upstream" --repo "$REPO" --color "fbca04" --description "Queued automatically for a new SentinelX upstream release" --force

      - name: Build release-scoped upstream parity dossiers
        id: parity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          rm -rf /tmp/upstream-releases
          if python3 .github/scripts/upstream-parity-report.py \
              --baseline .github/upstream-parity.json \
              --meta /tmp/upstream-meta.json \
              --out-dir /tmp/upstream-releases \
              2> /tmp/upstream-parity.err; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
            echo "release_count=$(jq '.releases | length' /tmp/upstream-meta.json)" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/upstream-parity.err
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "release_count=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create one immutable issue per upstream release
        if: steps.parity.outputs.failed != 'true' && steps.parity.outputs.release_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          jq -c '.releases[]' /tmp/upstream-meta.json | while IFS= read -r release; do
            marker="$(jq -r '.marker' <<<"$release")"
            title="$(jq -r '.title' <<<"$release")"
            body_file="$(jq -r '.body_file' <<<"$release")"

            # Search open and closed history: a release issue is created once and
            # never refreshed/reopened. Its resolving commit closes it.
            existing="$(
              gh issue list \
                --repo "$REPO" \
                --state all \
                --label "automation:upstream" \
                --limit 200 \
                --search "$marker in:body" \
                --json number \
                --jq '.[0].number // empty'
            )"
            if [[ -z "$existing" ]]; then
              gh issue create \
                --repo "$REPO" \
                --title "$title" \
                --label "automation:upstream" \
                --body-file "$body_file"
            fi
          done

      - name: Report upstream parity detector failure
        if: steps.parity.outputs.failed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          marker="automation-maintenance-error-upstream-parity"
          existing="$(gh issue list --repo "$REPO" --state open --label "automation:maintenance-error" --limit 50 --search "$marker in:body" --json number --jq '.[0].number // empty')"
          {
            echo "<!-- ${marker} -->"
            echo "<!-- automation-queue:maintenance-error -->"
            echo
            echo "The SentinelX upstream release-parity detector failed."
            echo
            echo "~~~~text"
            tail -n 200 /tmp/upstream-parity.err 2>/dev/null || true
            echo "~~~~"
            echo
            echo "Repair the detector so each upstream core/protocol release again creates one immutable maintenance dossier."
          } > /tmp/upstream-error.md
          if [[ -n "$existing" ]]; then
            gh issue edit "$existing" --repo "$REPO" --body-file /tmp/upstream-error.md
          else
            gh issue create --repo "$REPO" --title "maintenance detector: upstream parity failed" --label "automation:maintenance-error" --body-file /tmp/upstream-error.md
          fi
