name: Duplicate-code regression

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  duplicates:
    uses: codeandsolder/ci-workflows/.github/workflows/clone-regression.yml@5b073b2f545404d05f56ab674e9c4ace7295c525 # main
