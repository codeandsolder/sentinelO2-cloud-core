name: Cargo release-age quarantine

on:
  pull_request:
    paths:
      - "**/Cargo.lock"
      - "Cargo.lock"

permissions:
  contents: read

jobs:
  quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Enforce 72-hour crates.io quarantine
        run: python3 .github/scripts/cargo-release-quarantine.py --base-ref "${{ github.event.pull_request.base.sha }}" --hours 72
